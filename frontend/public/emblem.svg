<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="#1e3a8a">
  <!-- Ashoka Stambha / National Emblem of India -->
  <!-- Top disc/abacus -->
  <ellipse cx="100" cy="28" rx="48" ry="12" fill="#C8952A" opacity="0.9"/>
  
  <!-- Three Lions (simplified) -->
  <!-- Center lion -->
  <g transform="translate(100,60)" fill="#C8952A">
    <!-- Head -->
    <circle cx="0" cy="-20" r="16"/>
    <!-- Mane -->
    <ellipse cx="0" cy="-20" rx="22" ry="18" opacity="0.7"/>
    <!-- Body -->
    <rect x="-12" y="-8" width="24" height="28" rx="4"/>
    <!-- Crown detail -->
    <rect x="-8" y="-38" width="16" height="6" rx="2"/>
    <rect x="-4" y="-42" width="8" height="6" rx="2"/>
  </g>
  
  <!-- Left lion -->
  <g transform="translate(58,72) rotate(-25)" fill="#C8952A" opacity="0.85">
    <circle cx="0" cy="-12" r="12"/>
    <ellipse cx="0" cy="-12" rx="16" ry="14" opacity="0.6"/>
    <rect x="-8" y="-2" width="16" height="22" rx="3"/>
  </g>
  
  <!-- Right lion -->
  <g transform="translate(142,72) rotate(25)" fill="#C8952A" opacity="0.85">
    <circle cx="0" cy="-12" r="12"/>
    <ellipse cx="0" cy="-12" rx="16" ry="14" opacity="0.6"/>
    <rect x="-8" y="-2" width="16" height="22" rx="3"/>
  </g>
  
  <!-- Abacus base -->
  <rect x="40" y="98" width="120" height="10" rx="3" fill="#C8952A"/>
  
  <!-- Ashoka Chakra (24 spokes) -->
  <circle cx="100" cy="125" r="22" fill="none" stroke="#C8952A" stroke-width="3"/>
  <circle cx="100" cy="125" r="4" fill="#C8952A"/>
  <g stroke="#C8952A" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="105" x2="100" y2="145"/>
    <line x1="80" y1="125" x2="120" y2="125"/>
    <line x1="84.4" y1="109.4" x2="115.6" y2="140.6"/>
    <line x1="115.6" y1="109.4" x2="84.4" y2="140.6"/>
    <line x1="91" y1="105.5" x2="109" y2="144.5"/>
    <line x1="109" y1="105.5" x2="91" y2="144.5"/>
    <line x1="80.5" y1="116" x2="119.5" y2="134"/>
    <line x1="119.5" y1="116" x2="80.5" y2="134"/>
    <line x1="84" y1="110" x2="116" y2="140"/>
    <line x1="116" y1="110" x2="84" y2="140"/>
    <line x1="82" y1="113" x2="118" y2="137"/>
    <line x1="118" y1="113" x2="82" y2="137"/>
  </g>
  
  <!-- Lower pillar/column -->
  <path d="M60,148 L60,155 Q60,160 65,162 L135,162 Q140,160 140,155 L140,148 Z" fill="#C8952A"/>
  
  <!-- Bell-shaped base -->
  <path d="M55,162 C55,162 60,185 40,210 L160,210 C140,185 145,162 145,162 Z" fill="#C8952A" opacity="0.9"/>
  
  <!-- Base platform -->
  <rect x="35" y="210" width="130" height="8" rx="2" fill="#C8952A"/>
  
  <!-- Decorative band with animals -->
  <rect x="55" y="150" width="90" height="6" rx="1" fill="#C8952A" opacity="0.6"/>
  
  <!-- Text: Satyameva Jayate -->
  <text x="100" y="245" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#C8952A" letter-spacing="1">
    सत्यमेव जयते
  </text>
  
  <!-- English text -->
  <text x="100" y="265" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#C8952A" opacity="0.7" letter-spacing="2">
    SATYAMEVA JAYATE
  </text>
</svg>
