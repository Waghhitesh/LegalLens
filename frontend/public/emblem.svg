<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8B830"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#C8952A"/>
    </linearGradient>
  </defs>
  
  <!-- === CAPITAL / TOP PLATFORM === -->
  <ellipse cx="120" cy="30" rx="55" ry="14" fill="url(#goldGrad)" opacity="0.85"/>
  
  <!-- === THREE LIONS (front-facing, stylized) === -->
  <!-- Center lion body -->
  <g fill="url(#goldGrad)">
    <!-- Center lion head -->
    <circle cx="120" cy="52" r="18" fill="url(#goldLight)"/>
    <!-- Mane -->
    <ellipse cx="120" cy="50" rx="26" ry="22" opacity="0.55" fill="#D4A017"/>
    <!-- Eyes -->
    <circle cx="113" cy="49" r="1.5" fill="#8B6914"/>
    <circle cx="127" cy="49" r="1.5" fill="#8B6914"/>
    <!-- Nose -->
    <ellipse cx="120" cy="55" rx="3" ry="2" fill="#8B6914" opacity="0.6"/>
    <!-- Body -->
    <rect x="106" y="64" width="28" height="32" rx="5" fill="url(#goldGrad)"/>
    <!-- Crown/top ornament -->
    <rect x="110" y="28" width="20" height="8" rx="3" fill="url(#goldLight)"/>
    <rect x="114" y="22" width="12" height="8" rx="2" fill="url(#goldLight)"/>
    <circle cx="120" cy="20" r="4" fill="#E8B830"/>
  </g>
  
  <!-- Left lion (profile) -->
  <g fill="url(#goldGrad)" opacity="0.8">
    <circle cx="74" cy="66" r="14" fill="url(#goldLight)"/>
    <ellipse cx="74" cy="64" rx="18" ry="16" opacity="0.5" fill="#C8952A"/>
    <rect x="64" y="76" width="20" height="24" rx="4" fill="url(#goldGrad)"/>
    <!-- Front leg -->
    <rect x="60" y="92" width="8" height="14" rx="3" fill="#C8952A"/>
    <rect x="78" y="92" width="8" height="14" rx="3" fill="#C8952A"/>
  </g>
  
  <!-- Right lion (profile) -->
  <g fill="url(#goldGrad)" opacity="0.8">
    <circle cx="166" cy="66" r="14" fill="url(#goldLight)"/>
    <ellipse cx="166" cy="64" rx="18" ry="16" opacity="0.5" fill="#C8952A"/>
    <rect x="156" y="76" width="20" height="24" rx="4" fill="url(#goldGrad)"/>
    <!-- Front leg -->
    <rect x="154" y="92" width="8" height="14" rx="3" fill="#C8952A"/>
    <rect x="170" y="92" width="8" height="14" rx="3" fill="#C8952A"/>
  </g>
  
  <!-- === ABACUS (top band with animals) === -->
  <rect x="45" y="108" width="150" height="12" rx="3" fill="url(#goldGrad)"/>
  <!-- Decorative line on abacus -->
  <line x1="50" y1="114" x2="190" y2="114" stroke="#8B6914" strokeWidth="0.5" opacity="0.4"/>
  
  <!-- === ASHOKA CHAKRA (Dharma Wheel - 24 spokes) === -->
  <circle cx="120" cy="142" r="26" fill="none" stroke="url(#goldGrad)" strokeWidth="4"/>
  <circle cx="120" cy="142" r="5" fill="url(#goldGrad)"/>
  <!-- 24 spokes -->
  <g stroke="#C8952A" strokeWidth="1.2" strokeLinecap="round">
    <line x1="120" y1="118" x2="120" y2="166"/>
    <line x1="96" y1="142" x2="144" y2="142"/>
    <line x1="101.1" y1="123.1" x2="138.9" y2="160.9"/>
    <line x1="138.9" y1="123.1" x2="101.1" y2="160.9"/>
    <line x1="108.6" y1="118.8" x2="131.4" y2="165.2"/>
    <line x1="131.4" y1="118.8" x2="108.6" y2="165.2"/>
    <line x1="96.8" y1="130.6" x2="143.2" y2="153.4"/>
    <line x1="143.2" y1="130.6" x2="96.8" y2="153.4"/>
    <line x1="98.4" y1="126.2" x2="141.6" y2="157.8"/>
    <line x1="141.6" y1="126.2" x2="98.4" y2="157.8"/>
    <line x1="103.8" y1="121.6" x2="136.2" y2="162.4"/>
    <line x1="136.2" y1="121.6" x2="103.8" y2="162.4"/>
  </g>
  <!-- Small circles at spoke ends -->
  <g fill="#D4A017">
    <circle cx="120" cy="118" r="2"/><circle cx="120" cy="166" r="2"/>
    <circle cx="96" cy="142" r="2"/><circle cx="144" cy="142" r="2"/>
    <circle cx="101.1" cy="123.1" r="1.5"/><circle cx="138.9" cy="160.9" r="1.5"/>
    <circle cx="138.9" cy="123.1" r="1.5"/><circle cx="101.1" cy="160.9" r="1.5"/>
  </g>
  
  <!-- === LOWER PLATFORM === -->
  <path d="M55,170 L55,178 Q55,182 60,184 L180,184 Q185,182 185,178 L185,170 Z" fill="url(#goldGrad)"/>
  
  <!-- === BELL-SHAPED BASE (inverted lotus) === -->
  <path d="M50,184 C50,184 58,210 38,240 L202,240 C182,210 190,184 190,184 Z" fill="url(#goldGrad)" opacity="0.85"/>
  <!-- Lotus petal details -->
  <path d="M70,210 Q90,195 110,210" fill="none" stroke="#8B6914" strokeWidth="1" opacity="0.3"/>
  <path d="M100,210 Q120,195 140,210" fill="none" stroke="#8B6914" strokeWidth="1" opacity="0.3"/>
  <path d="M130,210 Q150,195 170,210" fill="none" stroke="#8B6914" strokeWidth="1" opacity="0.3"/>
  
  <!-- === BASE PLATFORM === -->
  <rect x="32" y="240" width="176" height="10" rx="3" fill="url(#goldGrad)"/>
  <line x1="36" y1="245" x2="204" y2="245" stroke="#8B6914" strokeWidth="0.5" opacity="0.3"/>
  
  <!-- === DEVANAGARI TEXT === -->
  <text x="120" y="275" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Mangal', serif" font-size="18" font-weight="bold" fill="#C8952A" letter-spacing="1.5">
    सत्यमेव जयते
  </text>
  
  <!-- === ENGLISH TEXT === -->
  <text x="120" y="295" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9" fill="#C8952A" opacity="0.6" letter-spacing="3" font-weight="600">
    SATYAMEVA JAYATE
  </text>
</svg>
